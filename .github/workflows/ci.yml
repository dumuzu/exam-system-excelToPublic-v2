name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci_only_database_password_2026
      SESSION_SECRET: ci-only-session-secret-that-is-longer-than-thirty-two-characters
      CRON_SECRET: ci-only-cron-secret-that-is-separate-and-longer-than-thirty-two
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Administrator
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-2026
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml up -d --build
      - name: Verify the initialized application
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml -f compose.build.yaml ps
          docker compose -f compose.yaml -f compose.build.yaml logs --no-color
          exit 1
      - name: Verify repeated administrator bootstrap
        run: BOOTSTRAP_ADMIN_PASSWORD= docker compose -f compose.yaml -f compose.build.yaml run --rm bootstrap
      - name: Clean up Docker services
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down --volumes

  publish-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dumuzu/exam-system-exceltopublic-v2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tag
        id: image
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
